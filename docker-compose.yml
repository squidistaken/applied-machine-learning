services:
  api:
    build: .
    image: aml
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tensorboard:
    build: .
    image: aml
    command: ["uv", "run", "--no-sync", "tensorboard", "--logdir", "logs/tensorboard", "--host", "0.0.0.0"]
    ports:
      - "6006:6006"
    volumes:
      - ./logs:/app/logs

  streamlit:
    build: .
    image: aml
    command: ["uv", "run", "--no-sync", "streamlit", "run", "main.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./main.py:/app/main.py
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ./src:/app/src
      - ./assets:/app/assets
