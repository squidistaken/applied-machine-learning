[project]
name = "applied-machine-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "httpx2>=2.3.0",
    "imutils>=0.5.4",
    "lightgbm>=4.6.0",
    "logging>=0.4.9.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.2",
    "pydantic>=2.13.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "kaggle>=2.2.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]


[tool.ruff]
line-length = 80

[tool.fastapi]
entrypoint = "src.api.router:app"
